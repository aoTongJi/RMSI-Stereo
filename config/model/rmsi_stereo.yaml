name: RMSI-Stereo
train_iters: 16
valid_iters: 32
instance:
  _target_: model.rmsi_stereo.RMSIStereo
  cfg:
    feat_dim: [64, 128, 192, 256]
    stem_dim: [32, 64, 128, 192, 256]
    gwc_max_disp: 192
    gwc_group: 8
    corr_level: 2
    corr_radius: 4
    n_downsample: 2


    use_legacy_structure_prompt: False

    msca:
      enabled: True
      mono_dim: 128
      attn_dim: 128
      num_heads: 4
      window_size: 8
      gate_hidden_dim: 64
      gate_init_bias: 0.0
      gamma: 0.05
      detach_mono: True


    cvum:
      enabled: True
      temperature: 1.0
      tau_d: 0.5
      mode: entropy_peak

    pretrained_model:
      name: DepthAnythingV2
      checkpoint: checkpoint/depth_anything_v2_vitl.pth
      features: 256
      out_channels: [256, 512, 1024, 1024]
      use_bn: False
      instance:
        _target_: model.depth_anything_v2.DepthAnythingV2
        encoder: vitl
        features: ${..features}
        out_channels: ${..out_channels}
        use_bn: False
        use_clstoken: False
